<div class="page-wrap">
  <div class="form-card card">
    <div class="form-header">
      <button class="btn-back" (click)="router.navigate(['/'])">← Volver</button>
      <h2>Agregar compañero</h2>
      <p class="form-sub">Completa los datos del compañero que deseas registrar.</p>
    </div>

    <div class="alert alert-error" *ngIf="error">{{ error }}</div>

    <form [formGroup]="form" (ngSubmit)="submit()">

      <div class="form-row">
        <div class="form-group">
          <label>Nombre <span class="required">*</span></label>
          <input type="text" formControlName="nombre" placeholder="Ej: Carlos">
          <span class="error-msg" *ngIf="form.controls['nombre'].invalid && form.controls['nombre'].touched">
            El nombre es obligatorio.
          </span>
        </div>
        <div class="form-group">
          <label>Apellido <span class="required">*</span></label>
          <input type="text" formControlName="apellido" placeholder="Ej: García">
          <span class="error-msg" *ngIf="form.controls['apellido'].invalid && form.controls['apellido'].touched">
            El apellido es obligatorio.
          </span>
        </div>
      </div>

        <div class="form-group autocomplete-container">
            <label>Universidad</label>
            <input type="text"
                   formControlName="universidad"
                   placeholder="Escribe para buscar universidad..."
                   (focus)="form.value.universidad ? filtrarUniversidades(form.value.universidad) : null"
                   (blur)="ocultarDropdown()"
                   autocomplete="off">

            <ul class="autocomplete-list" *ngIf="showDropdown">
                <li *ngFor="let u of filteredUniversidades" (mousedown)="seleccionarUniversidad(u)">
                    {{ u }}
                </li>
            </ul>
        </div>

        <div class="form-row">
            <!-- Reemplaza el form-group de carrera con este -->
            <div class="form-group autocomplete-container">
                <label>Carrera</label>
                <input type="text"
                       formControlName="carrera"
                       placeholder="Ej: Ingeniería de Sistemas"
                       (focus)="form.value.carrera ? filtrarCarreras(form.value.carrera) : null"
                       (blur)="ocultarDropdownCarrera()"
                       autocomplete="off">

                <ul class="autocomplete-list" *ngIf="showDropdownCarrera">
                    <li *ngFor="let c of filteredCarreras" (mousedown)="seleccionarCarrera(c)">
                        {{ c }}
                    </li>
                </ul>
            </div>

            <div class="form-group">
                <label>Ciclo</label>
                <select formControlName="ciclo"
                        class="form-select"
                        [ngClass]="{'is-placeholder': form.get('ciclo')?.value === '' || form.get('ciclo')?.value === null}">
                    <option value="" disabled selected>— Selecciona un ciclo —</option>
                    <option *ngFor="let c of ciclos" [value]="c">{{ c }}</option>
                </select>
            </div>
        </div>

      <div class="form-group">
        <label>Descripción (opcional)</label>
        <textarea formControlName="descripcion" rows="3"
          placeholder="Describe brevemente a este compañero..."></textarea>
        <span class="char-count">{{ (form.value.descripcion?.length ?? 0) }} / 300</span>
      </div>

      <button type="submit" class="btn btn-primary full" [disabled]="form.invalid || submitting">
        {{ submitting ? 'Guardando...' : 'Agregar compañero' }}
      </button>

    </form>
  </div>
</div>
